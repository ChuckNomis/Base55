<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Light Carousel</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --accent-color: #16a34a;
      --bg-color: #f3f4f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
      height: 380px;
      display: flex;
      align-items: center;
    }
    .carousel {
      display: flex;
      gap: 16px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 20px;
      width: 100%;
      height: 100%;
      scrollbar-width: thin;
      scrollbar-color: #d1d5db transparent;
      align-items: center;
    }
    .carousel::-webkit-scrollbar { height: 4px; }
    .carousel::-webkit-scrollbar-track { background: transparent; }
    .carousel::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 2px; }
    .card {
      flex: 0 0 220px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      height: 320px;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    }
    .card-img {
      width: 100%;
      height: 160px;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-img .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #d1d5db;
    }
    .card-img .placeholder span { font-size: 11px; }
    .card-body {
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      min-height: 0;
    }
    .card-title {
      color: #111827;
      font-weight: 600;
      font-size: 14px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-price {
      color: var(--accent-color);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .card-desc {
      color: #6b7280;
      font-size: 12px;
      line-height: 1.5;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-btn {
      display: block;
      text-align: center;
      width: 100%;
      padding: 9px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13px;
      text-decoration: none;
      transition: background 0.15s ease;
      margin-top: auto;
    }
    .card-btn:hover { background: #1d4ed8; }
    .status {
      color: #9ca3af;
      font-size: 14px;
      padding: 20px;
      text-align: center;
      width: 100%;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e5e7eb;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      color: #9ca3af;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="carousel" id="carousel">
    <div class="loader"><div class="spinner"></div><span class="loader-text">Loading products…</span></div>
  </div>

  <script>
    function safeHref(url) {
      if (!url) return '#';
      try {
        var parsed = new URL(url);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return url;
      } catch (e) {}
      return '#';
    }

    function escapeAttr(str) {
      return (str || '').replace(/&/g, '&amp;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#x27;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
    }

    var placeholderSvg = '<div class="placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>No Image</span></div>';

    function notifySizeToHost() {
      var target = trustedOrigin || parentOrigin;
      if (!target || target === '*') return;
      window.parent.postMessage({
        jsonrpc: '2.0',
        method: 'ui/notifications/size-changed',
        params: { width: document.documentElement.offsetWidth, height: document.documentElement.offsetHeight }
      }, target);
    }

    function renderProducts(products) {
      var carousel = document.getElementById('carousel');
      if (!products || products.length === 0) {
        carousel.innerHTML = '<div class="status">No products found.</div>';
        return;
      }
      carousel.innerHTML = products.map(function(p) {
        var imgHtml = p.image_url
          ? '<img src="' + p.image_url + '" alt="' + escapeAttr(p.title) + '" onerror="this.parentElement.innerHTML=\'' + placeholderSvg.replace(/'/g, "\\'").replace(/"/g, '&quot;') + '\'">'
          : placeholderSvg;
        var price = p.price || '';
        var link = safeHref(p.link);
        return (
          '<div class="card">' +
            '<div class="card-img">' + imgHtml + '</div>' +
            '<div class="card-body">' +
              '<div class="card-title">' + (p.title || '') + '</div>' +
              '<div class="card-price">' + price + '</div>' +
              '<div class="card-desc">' + (p.description || '') + '</div>' +
              '<a class="card-btn" href="' + link + '" target="_blank" rel="noopener noreferrer">View Product</a>' +
            '</div>' +
          '</div>'
        );
      }).join('');
      notifySizeToHost();
    }

    var mcpInitId = crypto.randomUUID
      ? crypto.randomUUID()
      : Array.from(crypto.getRandomValues(new Uint8Array(16)))
          .map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');

    var parentOrigin = document.referrer ? new URL(document.referrer).origin : '*';
    var trustedOrigin = null;
    var inMcpContext = false;

    var sampleProducts = [
      { title: 'Wireless Headphones', price: '$79.99', image_url: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=400&fit=crop', description: 'Premium sound quality with active noise cancellation.', link: '#' },
      { title: 'Leather Wallet', price: '$34.99', image_url: 'https://images.unsplash.com/photo-1627123424574-724758594913?w=400&h=400&fit=crop', description: 'Slim profile, full-grain leather, RFID blocking.', link: '#' },
      { title: 'Running Shoes', price: '$119.99', image_url: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop', description: 'Lightweight breathable mesh for daily training.', link: '#' },
      { title: 'Water Bottle', price: '$24.99', image_url: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400&h=400&fit=crop', description: 'Double-wall insulated, keeps cold 24h or hot 12h.', link: '#' }
    ];

    setTimeout(function() {
      if (!inMcpContext) renderProducts(sampleProducts);
    }, 2000);

    window.addEventListener('message', function(event) {
      var msg = event.data;
      if (msg && msg.type === 'set-colors') {
        var r = document.documentElement;
        if (msg.primary) r.style.setProperty('--primary-color', msg.primary);
        if (msg.accent)  r.style.setProperty('--accent-color',  msg.accent);
        if (msg.bg)      r.style.setProperty('--bg-color',      msg.bg);
        return;
      }
      if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;

      if (!trustedOrigin && event.origin) trustedOrigin = event.origin;

      if (msg.id === mcpInitId && msg.result !== undefined) {
        inMcpContext = true;
        window.parent.postMessage({
          jsonrpc: '2.0',
          method: 'ui/notifications/initialized',
          params: {}
        }, trustedOrigin || parentOrigin);
        notifySizeToHost();
        return;
      }

      if (msg.method === 'ui/notifications/tool-result' && msg.params) {
        var content = msg.params.content;
        if (Array.isArray(content)) {
          for (var i = 0; i < content.length; i++) {
            var item = content[i];
            if (item.type === 'text') {
              try {
                var data = JSON.parse(item.text);
                if (Array.isArray(data.products)) { renderProducts(data.products); return; }
              } catch (e) {}
            }
          }
        }
        return;
      }

      if (msg.products && Array.isArray(msg.products)) renderProducts(msg.products);
    });

    window.parent.postMessage({
      jsonrpc: '2.0',
      id: mcpInitId,
      method: 'ui/initialize',
      params: {
        appInfo: { name: 'Products Carousel Light', version: '1.0.0' },
        appCapabilities: {},
        protocolVersion: '2026-01-26'
      }
    }, parentOrigin);

  </script>
</body>
</html>
