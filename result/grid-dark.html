<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Products - Dark Grid</title>
  <style>
    :root {
      --primary-color: #7c3aed;
      --accent-color: #4ade80;
      --bg-color: #0f0f0f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg-color);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow-y: auto;
      overflow-x: hidden;
    }
    body::-webkit-scrollbar { width: 4px; }
    body::-webkit-scrollbar-track { background: transparent; }
    body::-webkit-scrollbar-thumb { background: #333; border-radius: 2px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 14px;
      padding: 20px;
      width: 100%;
    }
    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: #3a3a3a;
    }
    .card-img {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .card-img .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: #444;
    }
    .card-img .placeholder span { font-size: 11px; }
    .card-body {
      padding: 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .card-title {
      color: #e0e0e0;
      font-weight: 600;
      font-size: 13px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-price {
      color: var(--accent-color);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .card-desc {
      color: #666;
      font-size: 11px;
      line-height: 1.5;
      flex: 1;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-btn {
      display: block;
      text-align: center;
      width: 100%;
      padding: 8px;
      margin-top: 8px;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 7px;
      font-weight: 600;
      cursor: pointer;
      font-size: 12px;
      text-decoration: none;
      transition: background 0.15s ease;
    }
    .card-btn:hover { background: #6d28d9; }
    .status {
      color: #555;
      font-size: 14px;
      padding: 40px 20px;
      text-align: center;
      grid-column: 1 / -1;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      grid-column: 1 / -1;
      padding: 40px 20px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #2a2a2a;
      border-top-color: var(--primary-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      color: #555;
      font-size: 13px;
    }
  </style>
<style>:root{--primary-color:#3b82f6;--accent-color:#4ade80;--bg-color:#89bb1b;}</style></head>
<body>
  <div class="grid" id="grid">
    <div class="loader"><div class="spinner"></div><span class="loader-text" id="loaderText">Loading products…</span></div>
  </div>

  <script>
    function setStatus(text) {
      var el = document.getElementById('loaderText');
      if (el) el.textContent = text;
    }
    window.addEventListener('error', function(e) {
      setStatus('Script error: ' + (e.message || 'unknown'));
    });
    setStatus('Loading products… (script started)');

    function safeHref(url) {
      if (!url) return '#';
      try {
        var parsed = new URL(url);
        if (parsed.protocol === 'http:' || parsed.protocol === 'https:') return url;
      } catch (e) {}
      return '#';
    }

    function escapeAttr(str) {
      return (str || '').replace(/&/g, '&amp;')
                        .replace(/"/g, '&quot;')
                        .replace(/'/g, '&#x27;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
    }

    var placeholderSvg = '<div class="placeholder"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg><span>No Image</span></div>';

    function notifySizeToHost() {
      var target = trustedOrigin || parentOrigin;
      if (!target || target === '*') return;
      window.parent.postMessage({
        jsonrpc: '2.0',
        method: 'ui/notifications/size-changed',
        params: { width: document.documentElement.offsetWidth, height: document.documentElement.scrollHeight }
      }, target);
    }

    function renderProducts(products) {
      var grid = document.getElementById('grid');
      if (!products || products.length === 0) {
        grid.innerHTML = '<div class="status">No products found.</div>';
        return;
      }
      grid.innerHTML = products.map(function(p) {
        var imgHtml = p.image_url
          ? '<img src="' + p.image_url + '" alt="' + escapeAttr(p.title) + '" onerror="this.parentElement.innerHTML=\'' + placeholderSvg.replace(/'/g, "\\'").replace(/"/g, '&quot;') + '\'">'
          : placeholderSvg;
        var price = p.price || '';
        var link = safeHref(p.link);
        return (
          '<div class="card">' +
            '<div class="card-img">' + imgHtml + '</div>' +
            '<div class="card-body">' +
              '<div class="card-title">' + (p.title || '') + '</div>' +
              '<div class="card-price">' + price + '</div>' +
              '<div class="card-desc">' + (p.description || '') + '</div>' +
              '<a class="card-btn" href="' + link + '" target="_blank" rel="noopener noreferrer">View Product</a>' +
            '</div>' +
          '</div>'
        );
      }).join('');
      requestAnimationFrame(notifySizeToHost);
    }

    var mcpInitId = crypto.randomUUID
      ? crypto.randomUUID()
      : Array.from(crypto.getRandomValues(new Uint8Array(16)))
          .map(function(b) { return b.toString(16).padStart(2, '0'); }).join('');

    var parentOrigin = document.referrer ? new URL(document.referrer).origin : '*';
    var trustedOrigin = null;
    var inMcpContext = false;

    var sampleProducts = [
      { title: 'Wireless Headphones', price: '$79.99', image_url: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=400&h=400&fit=crop', description: 'Premium sound quality with active noise cancellation.', link: '#' },
      { title: 'Leather Wallet', price: '$34.99', image_url: 'https://images.unsplash.com/photo-1627123424574-724758594913?w=400&h=400&fit=crop', description: 'Slim profile, full-grain leather, RFID blocking.', link: '#' },
      { title: 'Running Shoes', price: '$119.99', image_url: 'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400&h=400&fit=crop', description: 'Lightweight breathable mesh for daily training.', link: '#' },
      { title: 'Water Bottle', price: '$24.99', image_url: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?w=400&h=400&fit=crop', description: 'Double-wall insulated, keeps cold 24h or hot 12h.', link: '#' },
      { title: 'Mechanical Keyboard', price: '$149.99', image_url: 'https://images.unsplash.com/photo-1601445638532-3ef6d56b3b0c?w=400&h=400&fit=crop', description: 'Tactile switches, full RGB backlight, tenkeyless.', link: '#' },
      { title: 'Minimalist Watch', price: '$199.99', image_url: 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop', description: 'Sapphire crystal glass, Swiss movement, leather strap.', link: '#' }
    ];

    setTimeout(function() {
      if (!inMcpContext) {
        setStatus('No host response after 2s — showing preview data. (Last seen: ' + lastMsgSummary + ')');
        renderProducts(sampleProducts);
      }
    }, 2000);

    var lastMsgSummary = 'none';

    window.addEventListener('message', function(event) {
      var msg = event.data;
      lastMsgSummary = (msg && (msg.method || (msg.id !== undefined ? 'response id=' + msg.id : typeof msg))) + ' from ' + event.origin;

      if (msg && msg.type === 'set-colors') {
        var r = document.documentElement;
        if (msg.primary) r.style.setProperty('--primary-color', msg.primary);
        if (msg.accent)  r.style.setProperty('--accent-color',  msg.accent);
        if (msg.bg)      r.style.setProperty('--bg-color',      msg.bg);
        return;
      }
      if (!msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;

      if (!trustedOrigin && event.origin) trustedOrigin = event.origin;

      if (msg.id === mcpInitId && msg.result !== undefined) {
        inMcpContext = true;
        setStatus('Host initialized — waiting for product data…');
        window.parent.postMessage({
          jsonrpc: '2.0',
          method: 'ui/notifications/initialized',
          params: {}
        }, trustedOrigin || parentOrigin);
        notifySizeToHost();
        return;
      }
      if (msg.id === mcpInitId && msg.error) {
        setStatus('Host rejected initialize: ' + JSON.stringify(msg.error));
        return;
      }

      if (msg.method === 'ui/notifications/tool-result' && msg.params) {
        var content = msg.params.content;
        var structured = msg.params.structuredContent;
        if (structured && Array.isArray(structured.products)) {
          renderProducts(structured.products);
          return;
        }
        if (structured && structured.result !== undefined) {
          var unwrapped = structured.result;
          if (typeof unwrapped === 'string') {
            try { unwrapped = JSON.parse(unwrapped); } catch (e) { unwrapped = null; }
          }
          if (unwrapped && Array.isArray(unwrapped.products)) {
            renderProducts(unwrapped.products);
            return;
          }
        }
        if (Array.isArray(content)) {
          for (var i = 0; i < content.length; i++) {
            var item = content[i];
            if (item.type === 'text') {
              try {
                var data = JSON.parse(item.text);
                if (Array.isArray(data.products)) { renderProducts(data.products); return; }
              } catch (e) {
                setStatus('Received tool-result but could not parse it: ' + e.message);
                return;
              }
            }
          }
        }
        setStatus('Received tool-result with no usable content.');
        return;
      }

      if (msg.products && Array.isArray(msg.products)) renderProducts(msg.products);
    });

    setStatus('Sending ui/initialize to host…');
    window.parent.postMessage({
      jsonrpc: '2.0',
      id: mcpInitId,
      method: 'ui/initialize',
      params: {
        appInfo: { name: 'Products Grid Dark', version: '1.0.0' },
        appCapabilities: {},
        protocolVersion: '2026-01-26'
      }
    }, parentOrigin);

  </script>
</body>
</html>
